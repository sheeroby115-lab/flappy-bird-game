<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Courier New', monospace;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }
    /* Overlay screens (HTML-based for crisp text) */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
    }
    .overlay.hidden {
      display: none;
    }
    #start-screen {
      background: rgba(0, 0, 0, 0.15);
    }
    .title {
      font-size: clamp(28px, 9vw, 48px);
      font-weight: bold;
      color: #fff;
      text-shadow: 3px 3px 0 #d4a032, 6px 6px 0 rgba(0,0,0,0.3);
      letter-spacing: 3px;
      margin-bottom: 10px;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .subtitle {
      font-size: clamp(14px, 4vw, 18px);
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.4);
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 20px;
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0.4; }
    }
    #gameover-screen {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
    }
    .gameover-title {
      font-size: clamp(30px, 10vw, 52px);
      font-weight: bold;
      color: #ff4757;
      text-shadow: 3px 3px 0 #8b0000, 6px 6px 0 rgba(0,0,0,0.4);
      letter-spacing: 3px;
      margin-bottom: 25px;
    }
    .score-panel {
      background: #ded895;
      border: 4px solid #543847;
      border-radius: 10px;
      padding: 18px 35px;
      margin-bottom: 25px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3);
      min-width: 200px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      margin: 8px 0;
    }
    .score-label {
      font-size: clamp(14px, 4vw, 18px);
      color: #543847;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .score-value {
      font-size: clamp(20px, 6vw, 28px);
      color: #e04a1a;
      font-weight: bold;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
    }
    .restart-prompt {
      font-size: clamp(14px, 4vw, 18px);
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.4);
      padding: 12px 25px;
      border-radius: 8px;
      animation: blink 1.2s step-start infinite;
    }
    .new-best {
      color: #ffd700;
      font-size: clamp(14px, 4vw, 18px);
      font-weight: bold;
      margin-top: -10px;
      margin-bottom: 15px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      animation: pulse 0.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    /* Score display during gameplay */
    #live-score {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(40px, 12vw, 64px);
      font-weight: bold;
      color: #fff;
      text-shadow: 3px 3px 0 #000, 5px 5px 0 rgba(0,0,0,0.3);
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none;
      display: none;
    }
    #live-score.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- Live score during gameplay -->
    <div id="live-score">0</div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <div class="title">FLAPPY BIRD</div>
      <div class="subtitle">Press SPACE or TAP to Start</div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="gameover-title">GAME OVER</div>
      <div class="new-best" id="new-best" style="display:none;">★ NEW BEST! ★</div>
      <div class="score-panel">
        <div class="score-row">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="final-score">0</span>
        </div>
        <div class="score-row">
          <span class="score-label">BEST</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
      <div class="restart-prompt">Press SPACE or TAP to Restart</div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // ============================================================
    // CANVAS & CONTEXT SETUP
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('game-wrapper');

    // Logical game resolution (virtual pixels)
    const GAME_WIDTH = 400;
    const GAME_HEIGHT = 700;

    // Scale canvas to fit container while preserving aspect ratio
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Fit game resolution into container preserving aspect
      const containerAspect = rect.width / rect.height;
      const gameAspect = GAME_WIDTH / GAME_HEIGHT;

      let displayW, displayH;
      if (containerAspect > gameAspect) {
        // Container is wider – fit by height
        displayH = rect.height;
        displayW = displayH * gameAspect;
      } else {
        // Container is taller – fit by width
        displayW = rect.width;
        displayH = displayW / gameAspect;
      }

      // Set CSS size of canvas
      canvas.style.width = displayW + 'px';
      canvas.style.height = displayH + 'px';

      // Set internal resolution (with DPR)
      canvas.width = GAME_WIDTH * dpr;
      canvas.height = GAME_HEIGHT * dpr;

      // Scale context so we draw in virtual pixels
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;

      scale = displayW / GAME_WIDTH;
      offsetX = 0;
      offsetY = (rect.height - displayH) / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ============================================================
    // GAME CONSTANTS
    // ============================================================
    const GROUND_HEIGHT = 90;
    const GROUND_Y = GAME_HEIGHT - GROUND_HEIGHT;

    const GRAVITY = 0.42;
    const JUMP_VELOCITY = -7.2;
    const MAX_FALL_SPEED = 12;

    const BIRD_X = 90;
    const BIRD_RADIUS = 14;
    const BIRD_WIDTH = 34;
    const BIRD_HEIGHT = 26;

    const PIPE_WIDTH = 64;
    const PIPE_GAP = 155;
    const PIPE_SPACING = 200;        // horizontal distance between pipe centers
    const PIPE_SPEED = 2.4;          // pixels per frame (at 60fps reference)
    const PIPE_MIN_TOP = 60;
    const PIPE_MAX_TOP = GROUND_Y - PIPE_GAP - 60;

    const BIRD_TILT_MAX = 0.45;      // radians
    const BIRD_TILT_MIN = -0.6;

    const SCORE_PER_PIPE = 1;

    // ============================================================
    // GAME STATE
    // ============================================================
    const STATE = {
      MENU: 0,
      PLAYING: 1,
      GAME_OVER: 2
    };

    let gameState = STATE.MENU;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappyBestScore') || '0', 10);

    // Bird state
    let bird = {
      y: GAME_HEIGHT / 2 - 50,
      vy: 0,
      tilt: 0,
      wingPhase: 0,
      alive: true
    };

    // Pipes: each { x, topHeight, scored }
    let pipes = [];
    let pipeSpawnTimer = 0;

    // Ground scroll offset for parallax
    let groundScroll = 0;

    // Animation frames (for consistency across refresh rates)
    let lastTime = 0;
    let accumulator = 0;
    const FIXED_STEP = 1000 / 60; // 60 FPS fixed timestep

    // UI elements
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const liveScoreEl = document.getElementById('live-score');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const newBestEl = document.getElementById('new-best');

    // ============================================================
    // WEB AUDIO API – SYNTHESIZED SOUNDS
    // ============================================================
    let audioCtx = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        audioCtx = null;
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      // Resume if suspended (browser autoplay policy)
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1320, now + 0.06);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.35);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      }
    }

    // ============================================================
    // INPUT HANDLING
    // ============================================================
    function handleJumpInput() {
      initAudio();

      if (gameState === STATE.MENU) {
        startGame();
      } else if (gameState === STATE.PLAYING) {
        // Jump
        bird.vy = JUMP_VELOCITY;
        bird.tilt = BIRD_TILT_MAX;
        playSound('jump');
      } else if (gameState === STATE.GAME_OVER) {
        // Small delay to prevent accidental restarts
        restartGame();
      }
    }

    // Keyboard
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        if (e.repeat) return;
        handleJumpInput();
      }
    });

    // Mouse & Touch on canvas
    canvas.addEventListener('mousedown', function (e) {
      e.preventDefault();
      handleJumpInput();
    });

    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      handleJumpInput();
    }, { passive: false });

    // Prevent context menu
    canvas.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    // ============================================================
    // GAME FUNCTIONS
    // ============================================================
    function startGame() {
      initAudio();
      gameState = STATE.PLAYING;
      score = 0;
      bird.y = GAME_HEIGHT / 2 - 50;
      bird.vy = 0;
      bird.tilt = 0;
      bird.alive = true;
      pipes = [];
      pipeSpawnTimer = 0;
      groundScroll = 0;

      // Spawn first pipe after a short delay
      spawnPipe();

      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      liveScoreEl.classList.add('visible');
      liveScoreEl.textContent = '0';
    }

    function restartGame() {
      startGame();
    }

    function gameOver() {
      gameState = STATE.GAME_OVER;
      bird.alive = false;

      // Update best score
      const isNewBest = score > bestScore;
      if (isNewBest) {
        bestScore = score;
        localStorage.setItem('flappyBestScore', String(bestScore));
      }

      // Update UI
      finalScoreEl.textContent = String(score);
      bestScoreEl.textContent = String(bestScore);
      newBestEl.style.display = isNewBest ? 'block' : 'none';

      liveScoreEl.classList.remove('visible');
      gameoverScreen.classList.remove('hidden');

      playSound('crash');
    }

    function spawnPipe() {
      const minTop = PIPE_MIN_TOP;
      const maxTop = PIPE_MAX_TOP;
      const topHeight = minTop + Math.random() * (maxTop - minTop);

      pipes.push({
        x: GAME_WIDTH + PIPE_WIDTH / 2,
        topHeight: topHeight,
        scored: false
      });

      // Set next spawn timer
      pipeSpawnTimer = PIPE_SPACING;
    }

    // ============================================================
    // COLLISION DETECTION
    // ============================================================
    function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
      // Find closest point on rectangle to circle center
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) <= (r * r);
    }

    function checkCollisions() {
      const birdLeft = BIRD_X - BIRD_RADIUS;
      const birdRight = BIRD_X + BIRD_RADIUS;
      const birdTop = bird.y - BIRD_RADIUS;
      const birdBottom = bird.y + BIRD_RADIUS;

      // Ceiling collision
      if (birdTop <= 0) {
        bird.y = BIRD_RADIUS;
        bird.vy = 0;
        if (gameState === STATE.PLAYING) {
          gameOver();
        }
        return;
      }

      // Ground collision
      if (birdBottom >= GROUND_Y) {
        bird.y = GROUND_Y - BIRD_RADIUS;
        if (gameState === STATE.PLAYING) {
          playSound('hit');
          gameOver();
        }
        return;
      }

      // Pipe collisions
      for (let i = 0; i < pipes.length; i++) {
        const p = pipes[i];
        const pipeLeft = p.x - PIPE_WIDTH / 2;
        const pipeRight = p.x + PIPE_WIDTH / 2;

        // Skip pipes far behind bird (for performance)
        if (pipeRight < birdLeft - 10) continue;
        if (pipeLeft > birdRight + 10) continue;

        // Top pipe rect: (pipeLeft, 0, PIPE_WIDTH, topHeight)
        // Bottom pipe rect: (pipeLeft, topHeight + PIPE_GAP, PIPE_WIDTH, GROUND_Y - (topHeight + PIPE_GAP))

        if (circleRectCollide(BIRD_X, bird.y, BIRD_RADIUS,
                              pipeLeft, 0, PIPE_WIDTH, p.topHeight)) {
          if (gameState === STATE.PLAYING) {
            playSound('hit');
            gameOver();
          }
          return;
        }

        const bottomPipeY = p.topHeight + PIPE_GAP;
        if (circleRectCollide(BIRD_X, bird.y, BIRD_RADIUS,
                              pipeLeft, bottomPipeY, PIPE_WIDTH,
                              GROUND_Y - bottomPipeY)) {
          if (gameState === STATE.PLAYING) {
            playSound('hit');
            gameOver();
          }
          return;
        }
      }
    }

    // ============================================================
    // UPDATE (fixed timestep)
    // ============================================================
    function update() {
      if (gameState === STATE.PLAYING) {
        // --- Bird physics ---
        bird.vy += GRAVITY;
        if (bird.vy > MAX_FALL_SPEED) bird.vy = MAX_FALL_SPEED;
        bird.y += bird.vy;

        // Tilt: pitch up when jumping, pitch down when falling
        const targetTilt = Math.max(BIRD_TILT_MIN,
          Math.min(BIRD_TILT_MAX, bird.vy * 0.06));
        bird.tilt += (targetTilt - bird.tilt) * 0.15;

        // Wing flapping animation
        bird.wingPhase += 0.25;

        // --- Pipe movement ---
        for (let i = 0; i < pipes.length; i++) {
          pipes[i].x -= PIPE_SPEED;

          // Score when bird passes pipe center
          if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH / 2 < BIRD_X - BIRD_RADIUS) {
            pipes[i].scored = true;
            score += SCORE_PER_PIPE;
            liveScoreEl.textContent = String(score);
            playSound('score');
          }
        }

        // Remove off-screen pipes
        pipes = pipes.filter(function (p) {
          return p.x + PIPE_WIDTH / 2 > -20;
        });

        // --- Pipe spawning ---
        if (pipes.length === 0) {
          pipeSpawnTimer -= 1;
          if (pipeSpawnTimer <= 0) {
            spawnPipe();
          }
        } else {
          // Spawn based on distance of last pipe
          const lastPipe = pipes[pipes.length - 1];
          if (lastPipe.x < GAME_WIDTH - PIPE_SPACING) {
            spawnPipe();
          }
        }

        // --- Ground scroll ---
        groundScroll = (groundScroll + PIPE_SPEED) % 24;

        // --- Collision ---
        checkCollisions();

      } else if (gameState === STATE.GAME_OVER) {
        // Let the bird fall to the ground if it's still above it
        if (bird.y + BIRD_RADIUS < GROUND_Y) {
          bird.vy += GRAVITY;
          if (bird.vy > MAX_FALL_SPEED) bird.vy = MAX_FALL_SPEED;
          bird.y += bird.vy;
          bird.tilt = Math.min(BIRD_TILT_MIN, bird.tilt - 0.04);
        } else {
          bird.y = GROUND_Y - BIRD_RADIUS;
          bird.vy = 0;
        }
      }
    }

    // ============================================================
    // RENDERING
    // ============================================================
    function drawBackground() {
      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, '#4EC0CA');
      skyGrad.addColorStop(0.7, '#8ED6E0');
      skyGrad.addColorStop(1, '#B8E8EE');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, GAME_WIDTH, GROUND_Y);

      // Clouds
      drawCloud(70, 110, 1.0);
      drawCloud(280, 70, 0.8);
      drawCloud(180, 160, 0.6);
      drawCloud(340, 180, 0.9);
      drawCloud(30, 230, 0.7);
    }

    function drawCloud(x, y, s) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
      ctx.arc(x + 26 * s, y - 8 * s, 28 * s, 0, Math.PI * 2);
      ctx.arc(x + 54 * s, y, 22 * s, 0, Math.PI * 2);
      ctx.arc(x + 28 * s, y + 8 * s, 24 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPipes() {
      for (let i = 0; i < pipes.length; i++) {
        const p = pipes[i];
        const left = p.x - PIPE_WIDTH / 2;
        const topH = p.topHeight;
        const bottomY = topH + PIPE_GAP;
        const bottomH = GROUND_Y - bottomY;

        drawPipeSegment(left, 0, PIPE_WIDTH, topH, true);
        drawPipeSegment(left, bottomY, PIPE_WIDTH, bottomH, false);
      }
    }

    function drawPipeSegment(x, y, w, h, isTop) {
      // Main pipe body
      const bodyGrad = ctx.createLinearGradient(x, 0, x + w, 0);
      bodyGrad.addColorStop(0, '#5FAE3A');
      bodyGrad.addColorStop(0.25, '#8FD34A');
      bodyGrad.addColorStop(0.5, '#B8E85A');
      bodyGrad.addColorStop(0.75, '#8FD34A');
      bodyGrad.addColorStop(1, '#4A8A2A');
      ctx.fillStyle = bodyGrad;
      ctx.fillRect(x, y, w, h);

      // Dark border
      ctx.strokeStyle = '#2E5A1A';
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);

      // Highlight stripe
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(x + 6, y, 6, h);

      // Cap (the wider part at the end)
      const capH = 26;
      const capExtend = 6;
      const capX = x - capExtend;
      const capW = w + capExtend * 2;
      let capY;
      if (isTop) {
        capY = y + h - capH;
      } else {
        capY = y;
      }

      const capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
      capGrad.addColorStop(0, '#5FAE3A');
      capGrad.addColorStop(0.25, '#9FE05A');
      capGrad.addColorStop(0.5, '#C8F06A');
      capGrad.addColorStop(0.75, '#9FE05A');
      capGrad.addColorStop(1, '#4A8A2A');
      ctx.fillStyle = capGrad;
      ctx.fillRect(capX, capY, capW, capH);

      ctx.strokeStyle = '#2E5A1A';
      ctx.lineWidth = 3;
      ctx.strokeRect(capX + 1.5, capY + 1.5, capW - 3, capH - 3);

      // Cap highlight
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(capX + 8, capY, 8, capH);
    }

    function drawGround() {
      // Main ground
      const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GAME_HEIGHT);
      groundGrad.addColorStop(0, '#DED895');
      groundGrad.addColorStop(1, '#C8B860');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GROUND_HEIGHT);

      // Top grass strip
      ctx.fillStyle = '#5FAE3A';
      ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 12);

      // Grass darker pattern (scrolling)
      ctx.fillStyle = '#4A8A2A';
      for (let i = -24; i < GAME_WIDTH + 24; i += 24) {
        const gx = i - groundScroll;
        ctx.fillRect(gx, GROUND_Y + 12, 12, 6);
      }

      // Ground texture pattern (scrolling diagonal lines)
      ctx.strokeStyle = 'rgba(180, 160, 100, 0.4)';
      ctx.lineWidth = 2;
      for (let i = -48; i < GAME_WIDTH + 48; i += 24) {
        const gx = i - (groundScroll * 1.0) % 24;
        ctx.beginPath();
        ctx.moveTo(gx, GROUND_Y + 24);
        ctx.lineTo(gx + 12, GROUND_Y + 40);
        ctx.stroke();
      }

      // Top border line of ground
      ctx.fillStyle = '#2E5A1A';
      ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 2);
    }

    function drawBird() {
      const x = BIRD_X;
      const y = bird.y;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(bird.tilt);

      // --- Body (yellow ellipse) ---
      ctx.fillStyle = '#F7D51D';
      ctx.beginPath();
      ctx.ellipse(0, 0, BIRD_RADIUS + 2, BIRD_RADIUS - 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body outline
      ctx.strokeStyle = '#B88A00';
      ctx.lineWidth = 2;
      ctx.stroke();

      // --- Belly (lighter) ---
      ctx.fillStyle = '#FFEFA0';
      ctx.beginPath();
      ctx.ellipse(1, 4, BIRD_RADIUS - 4, BIRD_RADIUS - 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // --- Wing (animated flapping) ---
      const wingAngle = Math.sin(bird.wingPhase) * 0.5;
      ctx.save();
      ctx.translate(-6, 2);
      ctx.rotate(wingAngle * 0.8);
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#B88A00';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Wing feather detail
      ctx.strokeStyle = 'rgba(184, 138, 0, 0.5)';
      ctx.beginPath();
      ctx.moveTo(-2, -3);
      ctx.lineTo(6, -1);
      ctx.moveTo(-2, 0);
      ctx.lineTo(6, 2);
      ctx.stroke();
      ctx.restore();

      // --- Eye (white) ---
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(8, -5, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#B88A00';
      ctx.lineWidth = 1;
      ctx.stroke();

      // --- Pupil ---
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath();
      ctx.arc(10, -5, 3, 0, Math.PI * 2);
      ctx.fill();

      // Eye shine
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(11, -6, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // --- Beak (orange) ---
      ctx.fillStyle = '#F57C1F';
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(24, 2);
      ctx.lineTo(12, 7);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#C05A0A';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Beak mouth line
      ctx.strokeStyle = '#C05A0A';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(13, 3);
      ctx.lineTo(21, 3.5);
      ctx.stroke();

      // --- Cheek blush ---
      ctx.fillStyle = 'rgba(255, 120, 100, 0.4)';
      ctx.beginPath();
      ctx.arc(4, 4, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ============================================================
    // MAIN RENDER
    // ============================================================
    function render() {
      // Clear
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // Background
      drawBackground();

      // Pipes
      drawPipes();

      // Ground
      drawGround();

      // Bird (always drawn, even during game over for falling animation)
      drawBird();

      // During menu, draw a subtle dark overlay handled by CSS
    }

    // ============================================================
    // GAME LOOP (fixed timestep with accumulator)
    // ============================================================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = Math.min(timestamp - lastTime, 100); // Cap delta to avoid spiral
      lastTime = timestamp;
      accumulator += delta;

      // Fixed timestep updates at 60Hz
      while (accumulator >= FIXED_STEP) {
        update();
        accumulator -= FIXED_STEP;
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================
    function init() {
      // Set best score display
      bestScoreEl.textContent = String(bestScore);

      // Initial bird position
      bird.y = GAME_HEIGHT / 2 - 50;

      // Start the loop
      requestAnimationFrame(gameLoop);

      // Prevent spacebar scrolling
      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
        }
      }, { passive: false });
    }

    init();

  })();
  </script>
</body>
